# vuna-base：标准库包（编译器与用户程序的第一个依赖）。
[package]
name = "vuna-base"


# 标准库的模块面就是公开面：所有 `Base.*` 模块都可跨包 import（叶子模块不设隐藏边界）。
# 门面（`Base` / `Base.Data` / `Base.Trait` / `Base.Container` / `Base.Effect(.Core/.Pure)` /
# `Prelude`）仍是推荐入口：它们做扁平重导出，leaf 只在需要具体实现/类型时才 import。
# 新增 leaf 要同时加进这份名单，否则依赖方会报 `LD_ModuleNotExported`。
[export]
modules = [
  "Base",
  "Base.Container",
  "Base.Container.Array",
  "Base.Container.HashMap",
  "Base.Container.HashSet",
  "Base.Container.Map",
  "Base.Container.PriorityQueue",
  "Base.Container.Queue",
  "Base.Container.TreeMap",
  "Base.Container.TreeSet",
  "Base.Data",
  "Base.Data.Base64",
  "Base.Data.Bits",
  "Base.Data.Bool",
  "Base.Data.Fin",
  "Base.Data.Float",
  "Base.Data.Function",
  "Base.Data.Int",
  "Base.Data.List",
