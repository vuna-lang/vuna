# vuna-base：标准库包（编译器与用户程序的第一个依赖）。
[package]
name = "vuna-base"


# 公开面只有门面：叶子模块（Base.Effect.Fs / Base.Container.HashMap / …）不跨包可见。
# - Base：扁平核心门面（import Base 即可用）
# - Base.Data / Base.Trait：扁平 + 命名空间路径
# - Base.Container / Base.Effect：只提供命名空间路径
# - Base.Effect.Core / Base.Effect.Pure：Eff 核心与纯效应表示的扁平/路径子门面
# - Prelude：按包上下文自动注入
[export]
modules = [
  "Base",
  "Base.Data",
  "Base.Trait",
  "Base.Container",
  "Base.Effect",
  "Base.Effect.Core",
  "Base.Effect.Pure",
  "Prelude"
]
