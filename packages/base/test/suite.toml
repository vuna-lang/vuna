# 由仓库 suite 拆出的 base suite；schema 见 docs/reference/testing.md。

[suite]
name = "vuna-base"
owner = "base"
jobs = 0
timeout = 300
min_cases = 30

[family.stdlib]
areas = ["base", "runtime", "ir", "codegen-ocaml", "codegen-wasm", "codegen-native"]
dir = "corpus/stdlib"
matrix = "pure-cross"
check = false
tags = ["stdlib"]

