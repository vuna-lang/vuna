# vuna-toolchain：产品工具链实现（命令族 fmt/lint/doc/search/lsp/repl/test/… 与命令面表）。
#
# 工具实现之间互相 import 是常态（Lsp→Index→Search、Doc→Index、Repl→Interp），
# 因此按功能范畴一个包，而不是按命令拆包。
[package]
name = "vuna-toolchain"

[dependencies]
vuna-target-ocaml = "../target-ocaml"
vuna-ir = "../ir"
vuna-compiler-base = "../compiler-base"
vuna-base = "../base"
vuna-compiler = "../compiler"
vuna-http = "../http"
vuna-plugin-kit = "../plugin-kit"

# 导出面必须是入口闭包可达的模块（`checks.vuna-single-pass` 守）；只服务 dev 的测试
# 夹具模块留在 `packages/dev/`，不要为了 dev 把它们放进产品工具链的导出面。
[export]
modules = [
  "Vuna.Add",
  "Vuna.Clean",
  "Vuna.Cli.Args",
  "Vuna.Cli.Err",
  "Vuna.Cli.Fmt",
  "Vuna.Cli.Help",
