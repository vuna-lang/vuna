[package]
name = "vuna-repl-corpus"

# REPL 缺口回归：纯函数断言在 lib/ReplGapsPure.vuna，两个入口
#   - app/Main.vuna：`vuna run test/corpus/repl`（main = 失败计数，0 通过）
#   - test/ReplPure.vuna：`vuna test test/corpus/repl`（效果入口，失败 exit 1）
# pty 行为的 shell 断言在 repl_v2_gaps.sh 里。依赖 `cli` 包以 import 工具链模块。
[dependencies]
vuna = "../../../packages/cli"
vuna-base = "../../../packages/base"

