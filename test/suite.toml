# 只跑 check 的夹具（终止性 / 解析错误）。
[family.term]
section = "37"
dir = "test/corpus/term"
kind = "check-ok"
tags = ["term"]

[family.term_err]
section = "37"
dir = "test/corpus/term_err"
kind = "check-error"
tags = ["term", "error"]

[family.err]
section = "4"
dir = "test/corpus/err"
kind = "error"
expected = "err"
interp = true
check = false
compile = false
tags = ["parse", "error"]

[family.lint]
section = "15"
dir = "test/corpus/lint"
kind = "lint"
tags = ["lint"]

[family.fix]
section = "16"
dir = "test/corpus/fix"
kind = "fix"
tags = ["lint", "fix"]

[family.run_err]
section = "5"
dir = "test/corpus/run_err"
kind = "error"
expected = "err"
interp = true
check = false
compile = true
exclude = ["03_div_zero", "04_unhandled_effect"]
tags = ["run", "error"]

[family.run_err_runtime]
section = "6"
dir = "test/corpus/run_err"
kind = "runtime-error"
expected = "err"
include = ["03_div_zero", "04_unhandled_effect"]
tags = ["run", "runtime-error"]

[family.float]
section = "60"
dir = "test/corpus/float"
kind = "auto"
interp = true
check = true
compile = true
run = true
compare_interp = false
tags = ["float"]
