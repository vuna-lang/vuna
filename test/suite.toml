# 仓库测试 driver 清单：`vuna dev suite --all` 依次调用各包的独立 suite。
# 每个 suite 自己的 `[suite] min_cases` 兜住 case 数；本文件只负责清单。
[suite]
name = "vuna"
owner = "vuna"
jobs = 0
timeout = 300
min_cases = 0
suites = [
  "packages/compiler/test/suite.toml",
  "packages/base/test/suite.toml",
  "packages/cli/test/suite.toml",
  "packages/web-cli/test/suite.toml"
]
