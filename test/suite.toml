# vuna 原生测试 suite。schema 与语义见 docs/reference/testing.md。
#
# `[family.*]` 按目录约定展开成 golden/error case；旧 shell 章节（迁移期）由
# test/suite/sections/*.sh 自动发现，不需要在这里声明。

[suite]
name = "vuna"
jobs = 0          # 0 = auto（探测全部可用核）
timeout = 300

[family.run]
section = "1"
dir = "test/corpus/run"
kind = "auto"
interp = true
check = false
compile = true
run = true
compare_interp = true
tags = ["run"]

[family.dt]
section = "34"
dir = "test/corpus/dt"
kind = "golden"
expected = "out"
interp = true
check = true
compile = true
run = true
compare_interp = true
tags = ["dt"]

[family.dt_err]
section = "34"
dir = "test/corpus/dt_err"
kind = "error"
expected = "err"
interp = false
check = true
compile = true
tags = ["dt", "error"]

[family.dt_base]
section = "34"
dir = "test/corpus/dt_base"
kind = "golden"
expected = "out"
interp = true
check = true
compile = true
run = true
compare_interp = true
tags = ["dt", "base"]

[family.dt_io]
section = "34"
dir = "test/corpus/dt_io"
kind = "golden"
expected = "out"
interp = false
check = true
compile = true
run = true
compare_interp = false
tags = ["dt", "io"]
# 精化器性能回归（D48 / D46 / S1–S4）：只跑 `vuna check`，不编译不运行；
# 单 case 超时 15s，长 do / 长 >>= 链超时即失败（期望实现把耗时压到线性）。
[family.elab_perf]
section = "34"
dir = "test/corpus/elab_perf"
kind = "check-ok"
check = true
compile = false
run = false
interp = false
timeout = 15
tags = ["dt", "perf"]

# 目录型夹具：auto 按子目录里的 expected.out / expected.err 判定 golden/error。
[family.modules]
section = "2"
dir = "test/corpus/modules"
kind = "auto"
entry = "app/Main.vuna"
interp = true
check = false
compile = true
run = true
compare_interp = true
tags = ["modules"]

[family.records_files]
