# vuna 原生测试 suite。schema 与语义见 docs/reference/testing.md。
#
# 阶段矩阵由夹具期望文件的阶段限定后缀表达（`<base>.<stage>.<artifact>`，如
# `01.check.err` / `01.interp.out` / `01.run.out`）；裸 `.out`（interp+run 共享
# golden）与裸 `.err`（check 负例）是兼容形态。family 旗标只是各阶段的上限。
# 工具链/包/REPL/LSP/缓存类用例在 test/suite/steps/（声明式 steps family），见 testing.md。

[suite]
name = "vuna"
jobs = 0          # 0 = auto（探测全部可用核）
timeout = 300
min_cases = 630    # case 数下限：整族从配置消失时显式失败（当前 662）

# --- golden（interp + check + compile + run + 互证）---
[family.dt]
section = "34"
dir = "test/corpus/dt"
check = true
tags = ["dt"]

[family.dt_err]
section = "34"
dir = "test/corpus/dt_err"
interp = false
check = true
tags = ["dt", "error"]

[family.dt_base]
section = "34"
dir = "test/corpus/dt_base"
check = true
tags = ["dt", "base"]

# 只做 compile + run（原 `.nointerp` 夹具：效果程序 / 不可归约内建）。
[family.dt_io]
section = "34"
dir = "test/corpus/dt_io"
interp = false
check = true
compare_interp = false
tags = ["dt", "io"]

# 精化器性能回归（S1–S4）：只跑 `vuna check`，不编译不运行；
# 单 case 超时 15s，长 do / 长 >>= 链超时即失败（期望实现把耗时压到线性）。
[family.elab_perf]
section = "34"
dir = "test/corpus/elab_perf"
kind = "check-ok"
timeout = 15
tags = ["dt", "perf"]

# 声明式步进用例（run/expect 指令，见 docs/reference/testing.md）
[family.steps_native]
section = "90"
dir = "test/suite/steps"
kind = "steps"
tags = ["declarative"]

[family.run]
section = "1"
dir = "test/corpus/run"
check = false
tags = ["run"]

[family.modules]
section = "2"
dir = "test/corpus/modules"
entry = "app/Main.vuna"
check = false
tags = ["modules"]

[family.records_files]
section = "18"
dir = "test/corpus/records"
check = false
tags = ["records"]

[family.records_dirs]
section = "20"
dir = "test/corpus/records"
entry = "app/Main.vuna"
check = false
tags = ["records"]

[family.traits_files]
section = "22"
dir = "test/corpus/traits"
check = false
tags = ["traits"]

[family.traits_dirs]
section = "24"
dir = "test/corpus/traits"
entry = "app/Main.vuna"
check = false
tags = ["traits"]

[family.monad]
section = "26"
dir = "test/corpus/monad"
check = true
tags = ["monad"]

[family.stdlib]
section = "27"
dir = "test/corpus/stdlib"
check = false
tags = ["stdlib"]

[family.float]
section = "60"
dir = "test/corpus/float"
check = true
tags = ["float"]

# --- check 为主（interp 不支持 / 无 golden）---
[family.type_ok]
section = "7"
dir = "test/corpus/type_ok"
interp = false
check = true
compare_interp = false
tags = ["types"]

[family.type_err]
section = "8"
dir = "test/corpus/type_err"
interp = false
check = true
run = false
compare_interp = false
tags = ["types", "error"]

[family.typed_ok]
section = "11"
dir = "test/corpus/typed_ok"
interp = false
check = true
compare_interp = false
tags = ["types"]

[family.type_modules]
section = "9"
dir = "test/corpus/type_modules"
entry = "app/Main.vuna"
interp = false
check = true
compare_interp = false
tags = ["types", "modules"]

# 只跑 check 的夹具（终止性）。
[family.term]
section = "37"
dir = "test/corpus/term"
kind = "check-ok"
tags = ["term"]

[family.term_err]
section = "37"
dir = "test/corpus/term_err"
kind = "check-error"
tags = ["term", "error"]

# --- error（解析 / 求值负例）---
[family.err]
section = "4"
dir = "test/corpus/err"
compile = false
tags = ["parse", "error"]

[family.pkg_err]
section = "36"
dir = "test/corpus/pkg_err"
entry = "lib/Main.vuna"
check = true
compile = false
interp = false
run = false
compare_interp = false
tags = ["pkg", "error"]

[family.run_err]
section = "5"
dir = "test/corpus/run_err"
check = false
tags = ["run", "error"]

# --- 工具链（lint / fix）---
[family.lint]
section = "15"
dir = "test/corpus/lint"
kind = "lint"
tags = ["lint"]

[family.fix]
section = "16"
dir = "test/corpus/fix"
kind = "fix"
tags = ["lint", "fix"]
