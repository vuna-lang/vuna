# vuna-compiler：编译器包（seed 的来源）。
# 只包含“把源码变成 OCaml / 生成 seed”所需的模块 + 编译器自己的 CLI 入口；
# 工具链（fmt/lint/repl/doc/test）在根包 vuna，不进入 seed 闭包。
#
# 目录即层（M25 源码重组）：Frontend（词法/语法/TOML/manifest）→ Packages（包图）
# → Loader（模块图/名字解析/flatten）→ Core（TT/NbE）→ Elab（双向精化）→ Codegen
# （擦除 + OCaml 生成）→ Driver（facade/CLI）。同包内模块经 import 闭包可见即可；
# 这里列出全部模块，作为包对外的完整模块面（依赖包可见性由 [export] 控制）。
[package]
name = "vuna-compiler"

[export]
modules = [
  "Vuna.Compiler.Common",
  "Vuna.Compiler.Diag",
  "Vuna.Compiler.Diag.Format",
  "Vuna.Compiler.Diagnostics.Ic",
