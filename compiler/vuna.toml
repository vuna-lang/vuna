# vuna-compiler：编译器包（seed 的来源）。
# 只包含“把源码变成 OCaml / 生成 seed”所需的模块 + 编译器自己的 CLI 入口；
# 工具链（fmt/lint/repl/doc/test）在根包 vuna，不进入 seed 闭包。
[package]
name = "vuna-compiler"
version = "0.1.0"
edition = "2026"

[export]
modules = [
  "Vuna.Compiler.Common",
  "Vuna.Compiler.Frontend.Ast",
  "Vuna.Compiler.Frontend.Lexer",
  "Vuna.Compiler.Frontend.Parser",
  "Vuna.Compiler.Frontend.Toml",
  "Vuna.Compiler.Frontend.Manifest",
  "Vuna.Compiler.Packages.Pkg",
  "Vuna.Compiler.Loader",
  "Vuna.Compiler.Loader.Builtins",
  "Vuna.Compiler.Core",
  "Vuna.Compiler.Elab",
  "Vuna.Compiler.Elab.Termination",
  "Vuna.Compiler.Elab.Quant",
  "Vuna.Compiler.Elab.Kind",
  "Vuna.Compiler.Elab.Prelude",
  "Vuna.Compiler.Elab.Match",
  "Vuna.Compiler.Elab.Records",
  "Vuna.Compiler.Elab.Derive",
  "Vuna.Compiler.Codegen",
  "Vuna.Compiler.Driver.Split",
  "Vuna.Compiler.Driver.SplitCli",
  "Vuna.Compiler.Driver.Compile",
  "Vuna.Compiler.Driver.CompilerCli",
  "Vuna.Compiler.Driver.Process",
  "Vuna.Compiler.Driver.Dt"
]

[dependencies]
vuna-base = "../base"
