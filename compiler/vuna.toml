# vuna-compiler：编译器包（seed 的来源）。
# 只包含“把源码变成 OCaml / 生成 seed”所需的模块 + 编译器自己的 CLI 入口；
# 工具链（fmt/lint/repl/doc/test）在根包 vuna，不进入 seed 闭包。
[package]
name = "vuna-compiler"
version = "0.1.0"
edition = "2026"

[export]
modules = [
  "Vuna.Compiler.Common",
  "Vuna.Compiler.Ast",
  "Vuna.Compiler.Lexer",
  "Vuna.Compiler.Parser",
  "Vuna.Compiler.Builtins",
  "Vuna.Compiler.Toml",
  "Vuna.Compiler.Manifest",
  "Vuna.Compiler.Pkg",
  "Vuna.Compiler.Loader",
  "Vuna.Compiler.Typecheck",
  "Vuna.Compiler.TypedCodegen",
  "Vuna.Compiler.Core",
  "Vuna.Compiler.DtPrelude",
  "Vuna.Compiler.DtQuant",
  "Vuna.Compiler.DtKind",
  "Vuna.Compiler.DtTerm",
  "Vuna.Compiler.DtMatch",
  "Vuna.Compiler.Elab",
  "Vuna.Compiler.CoreCodegen",
  "Vuna.Compiler.Dt",
  "Vuna.Compiler.Split",
  "Vuna.Compiler.SplitCli",
  "Vuna.Compiler.Compile",
  "Vuna.Compiler.CompilerCli"
]

[dependencies]
vuna-base = "../base"
