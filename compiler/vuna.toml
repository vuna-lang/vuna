# vuna-compiler：编译器包（seed 的来源）。
# 只包含“把源码变成 OCaml / 生成 seed”所需的模块 + 编译器自己的 CLI 入口；
# 工具链（fmt/lint/repl/doc/test）在根包 vuna，不进入 seed 闭包。
[package]
name = "vuna-compiler"
version = "0.1.0"
edition = "2026"

[export]
modules = [
  "Vuna.Base",
  "Vuna.Ast",
  "Vuna.Lexer",
  "Vuna.Parser",
  "Vuna.Builtins",
  "Vuna.Toml",
  "Vuna.Manifest",
  "Vuna.Pkg",
  "Vuna.Loader",
  "Vuna.Typecheck",
  "Vuna.Codegen",
  "Vuna.TypedCodegen",
  "Vuna.Split",
  "Vuna.SplitCli",
  "Vuna.Compile",
  "Vuna.CompilerCli"
]

[dependencies]
vuna-stdlib = "../stdlib"
