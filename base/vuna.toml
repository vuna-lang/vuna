# vuna-base：标准库包（编译器与用户程序的第一个依赖）。
[package]
name = "vuna-base"


[export]
modules = [
  "Base",
  "Base.Pair",
  "Base.Bool",
  "Base.Show",
  "Base.Eq",
  "Base.Ord",
  "Base.Int",
  "Base.Interp",
  "Base.Debug",
  "Base.List",
  "Base.Nat",
  "Base.Vec",
  "Base.Maybe",
  "Base.Result",
  "Base.String",
  "Base.Sort",
  "Base.Map",
  "Base.HashMap",
  "Base.HashSet",
  "Base.IntMap",
  "Base.Array",
  "Base.IORef",
  "Base.ST",
  "Base.MArray",
  "Base.Buffer",
  "Base.State",
  "Base.Reader",
  "Base.Error",
  "Base.Effect",
  "Base.Eff",
  "Base.Eff.Reader",
  "Base.EffState",
  "Base.EffFs",
  "Base.EffError",
  "Base.EffExn",
  "Base.EffAsync",
  "Base.EffChannel",
  "Base.EffMutex",
  "Base.EffClock",
  "Base.EffConsole",
  "Base.EffEnv",
  "Base.EffProcess",
  "Base.EffSched",
  "Base.ErrorT",
  "Base.Monad",
  "Base.ReaderT",
  "Base.StateT",
  "Base.IO",
  "Prelude"
]

# M27：效应能力声明（Base.IO 包装 prim_*）；W10 增加 env/clock（EffEnv/EffClock）。
[capabilities]
effects = ["console", "fs", "process", "env", "clock", "unsafe"]
