# vuna-base：标准库包（编译器与用户程序的第一个依赖）。
[package]
name = "vuna-base"
version = "0.1.0"
edition = "2026"


[export]
modules = [
  "Base",
  "Base.Pair",
  "Base.Bool",
  "Base.Show",
  "Base.Eq",
  "Base.Ord",
  "Base.List",
  "Base.Nat",
  "Base.Vec",
  "Base.Maybe",
  "Base.Result",
  "Base.String",
  "Base.Sort",
  "Base.Map",
  "Base.Monad",
  "Base.IO",
  "Prelude"
]

# M27：效应能力声明（Base.IO 包装 prim_*）。
[capabilities]
effects = ["console", "fs", "process"]
