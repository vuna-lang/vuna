# vuna-base：标准库包（编译器与用户程序的第一个依赖）。
[package]
name = "vuna-base"


[export]
modules = [
  "Base",
  "Base.Pair",
  "Base.Bool",
  "Base.Show",
  "Base.Eq",
  "Base.Ord",
  "Base.Int",
  "Base.Interp",
  "Base.List",
  "Base.Nat",
  "Base.Vec",
  "Base.Maybe",
  "Base.Result",
  "Base.String",
  "Base.Sort",
  "Base.Map",
  "Base.HashMap",
  "Base.HashSet",
  "Base.IntMap",
  "Base.Array",
  "Base.IORef",
  "Base.ST",
  "Base.MArray",
  "Base.Buffer",
  "Base.State",
  "Base.Reader",
  "Base.Error",
  "Base.Effect",
  "Base.ErrorT",
  "Base.Monad",
  "Base.ReaderT",
  "Base.StateT",
  "Base.IO",
  "Prelude"
]

# M27：效应能力声明（Base.IO 包装 prim_*）。
[capabilities]
effects = ["console", "fs", "process", "unsafe"]
