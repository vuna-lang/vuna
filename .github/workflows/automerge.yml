name: automerge

# 门禁全绿的 PR 自动进入合并队列。非 draft、同仓库分支、没有 hold 标签时打开
# auto-merge；draft / hold 时先从队列移除再关闭 auto-merge。队列的合并由 GitHub 执行，
# 不在本 workflow 里直接 merge。
# GitHub 回归（community#209348）后 armed PR 不会在 checks 变绿时自动入队：
# 事件恰好发生在变绿之后时由本 workflow 直接补一次 enqueue；其余由
# merge-queue-sweep.yml 在 ci / gates 完成时和 cron 兜底补齐。
# stack 用 includeStack 整条 arm / disarm；整条入队由 sweep 走 REST merge-async。
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, synchronize]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: enable or disable auto-merge
        env:
          # 用 PAT 执行入队时，后续的 push 事件仍按仓库设置触发；GITHUB_TOKEN 归
          # github-actions[bot]，GitHub 不为其推送创建工作流运行。
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail

          pr_json=$(gh pr view "$PR" --repo "$REPO" \
            --json id,headRefOid,isDraft,labels,headRepository,autoMergeRequest,mergeStateStatus)
          pr_id=$(jq -r '.id' <<<"$pr_json")
          head_oid=$(jq -r '.headRefOid' <<<"$pr_json")
          merge_state=$(jq -r '.mergeStateStatus // empty' <<<"$pr_json")
          is_draft=$(jq -r '.isDraft' <<<"$pr_json")
          head_repo=$(jq -r '.headRepository.nameWithOwner // empty' <<<"$pr_json")
          labels=$(jq -r '.labels[].name' <<<"$pr_json")
          auto=$(jq -r '.autoMergeRequest // empty' <<<"$pr_json")

          # 队列状态和 stack 只能走 GraphQL。
          in_queue=false
          queue_enabled=false
          stack_number=""
          stack_json='{}'
          # shellcheck disable=SC2016
          if queue_json=$(gh api graphql \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR" \
            -f query='
              query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    isInMergeQueue
                    isMergeQueueEnabled
                    stack {
                      number
                      size
                      entries(first:50) {
                        nodes {
                          position
                          pullRequest {
                            id
                            number
                            state
                            isDraft
                            isInMergeQueue
                            labels(first:50) { nodes { name } }
                            autoMergeRequest(includeStack: true) { mergeMethod }
                          }
                        }
                      }
                    }
                  }
                }
              }' 2>/dev/null); then
            in_queue=$(jq -r '.data.repository.pullRequest.isInMergeQueue // false' <<<"$queue_json")
            queue_enabled=$(jq -r '.data.repository.pullRequest.isMergeQueueEnabled // false' <<<"$queue_json")
            stack_number=$(jq -r '.data.repository.pullRequest.stack.number // empty' <<<"$queue_json")
            stack_json=$(jq -c '.data.repository.pullRequest.stack // {}' <<<"$queue_json")
          fi

          stack_open=$(jq -c '[.entries.nodes[]? | select(.pullRequest.state == "OPEN")]' <<<"$stack_json")
          stack_top=$(jq -r '
            if length == 0 then empty
            else max_by(.position) | [.pullRequest.number, .pullRequest.id] | @tsv
            end' <<<"$stack_open")
          stack_top_pr=$(cut -f1 <<<"$stack_top")
          stack_top_id=$(cut -f2 <<<"$stack_top")
          stack_armed=$(jq -r '
            if length == 0 then false
            else ((max_by(.position).pullRequest.autoMergeRequest) != null)
            end' <<<"$stack_open")
          stack_blocked=$(jq -r '
            [.[] | select(
              .pullRequest.isDraft
              or any(.pullRequest.labels.nodes[].name;
                     . == "blocked" or . == "needs-info" or . == "wontfix")
            )] | length' <<<"$stack_open")

          # ---------- stack：整条 arm / disarm ----------
          if [ -n "$stack_number" ]; then
            if [ -z "$stack_top_id" ]; then
              echo "automerge: stack #$stack_number 没有 open 层，跳过"
              exit 0
            fi
            if [ "$stack_blocked" -gt 0 ] || [ "$head_repo" != "$REPO" ]; then
              # 队列里的层逐个 dequeue；GitHub 会级联移除上面的层。
              jq -r '.[] | select(.pullRequest.isInMergeQueue) | .pullRequest.id' <<<"$stack_open" |
                while read -r id; do
                  [ -n "$id" ] || continue
                  # shellcheck disable=SC2016
                  gh api graphql \
                    -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}' \
                    -f id="$id" >/dev/null 2>&1 || true
                done
              if [ "$stack_armed" = "true" ]; then
                # shellcheck disable=SC2016
                gh api graphql -f id="$stack_top_id" -F includeStack=true -f query='
                  mutation($id:ID!,$includeStack:Boolean!){
                    disablePullRequestAutoMerge(input:{pullRequestId:$id,includeStack:$includeStack}){
                      clientMutationId
                    }
                  }' >/dev/null 2>&1 || true
              fi
              echo "automerge: stack #$stack_number 有 draft / hold，已 disarm"
              exit 0
            fi

            if [ "$stack_armed" != "true" ]; then
              # GitHub 在只想 rebase 的仓库上可能先按默认 squash 校验 includeStack 并拒绝；
              # 这里只尽力 arm，整条入队始终由 sweep 的 REST merge-async 负责。
              if [ "$queue_enabled" = "true" ]; then
                # shellcheck disable=SC2016
                if gh api graphql -f id="$stack_top_id" -F includeStack=true -f query='
                  mutation($id:ID!,$includeStack:Boolean!){
                    enablePullRequestAutoMerge(input:{pullRequestId:$id,includeStack:$includeStack}){
                      clientMutationId
                    }
                  }' >/dev/null; then
                  echo "automerge: stack #$stack_number 已 arm（top #$stack_top_pr）"
                else
                  echo "automerge: stack #$stack_number 的 includeStack arm 被拒绝；由 sweep 入队" >&2
                fi
              else
                # shellcheck disable=SC2016
                if gh api graphql -f id="$stack_top_id" -F includeStack=true -f method=REBASE -f query='
                  mutation($id:ID!,$includeStack:Boolean!,$method:PullRequestMergeMethod!){
                    enablePullRequestAutoMerge(input:{
                      pullRequestId:$id,includeStack:$includeStack,mergeMethod:$method
                    }){clientMutationId}
                  }' >/dev/null; then
                  echo "automerge: stack #$stack_number 已 arm（top #$stack_top_pr）"
                else
                  echo "automerge: stack #$stack_number 的 includeStack arm 被拒绝；由 sweep 入队" >&2
                fi
              fi
            fi

            # 整条入队由 sweep 通过 REST merge-async 负责，这里不按单层入队。
            exit 0
          fi

          # ---------- 普通 PR ----------
          hold=""
          if printf '%s\n' "$labels" | grep -Eq '^(blocked|needs-info|wontfix)$'; then
            hold=yes
          fi

          if [ "$is_draft" = "true" ] || [ -n "$hold" ] || [ "$head_repo" != "$REPO" ]; then
            # 只 disable auto-merge 不会把已经在队列里的 PR 拿掉；hold 必须显式 dequeue。
            if [ "$in_queue" = "true" ]; then
              # shellcheck disable=SC2016
              if ! gh api graphql \
                -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}' \
                -f id="$pr_id" >/dev/null; then
                echo "automerge: 无法把 PR #$PR 移出队列" >&2
              fi
            fi
            if [ -n "$auto" ]; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            fi
            exit 0
          fi

          if [ "$in_queue" = "true" ]; then
            exit 0
          fi

          # 已 arm 的 PR 在事件发生时已经变绿，就直接补一次 enqueue：GitHub 回归后
          # 它不会自动入队，等 sweep 还要多一个回合。
          if [ -n "$auto" ] && [ "$merge_state" = "CLEAN" ] && [ "$queue_enabled" = "true" ]; then
            # shellcheck disable=SC2016
            if gh api graphql \
              -f query='mutation($id:ID!,$head:GitObjectID){
                enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$head}){clientMutationId}
              }' \
              -f id="$pr_id" -f head="$head_oid" >/dev/null; then
              echo "automerge: #$PR 在事件时已 CLEAN，直接入队"
            else
              echo "automerge: #$PR 入队失败（留给 sweep 重试）" >&2
            fi
          fi

          if [ -z "$auto" ]; then
            if [ "$queue_enabled" = "true" ]; then
              # 队列自己决定 merge 方法（ruleset 里是 REBASE），arm 时不需要指定策略。
              gh pr merge "$PR" --repo "$REPO" --auto
            else
              gh pr merge "$PR" --repo "$REPO" --auto --rebase
            fi
          fi