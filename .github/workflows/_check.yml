name: check

# 单个门禁分组的可复用 job：checkout → restore → `nix run .#ci -- <group>` → save。
# 分组本身来自 nix/checks/groups.nix；本文件只负责运行环境与 cache 生命周期。
on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      timeout:
        required: true
        type: number
      # nix build 的并行度。suite 类长尾用 1（全部核给一个 derivation）。
      jobs:
        required: false
        type: number
        default: 2
      # 是否需要先求值整个 flake（挡住组外 check 的 eval 错误）。
      eval:
        required: false
        type: boolean
        default: false
      # PR gate 计划器使用的标签串（type:/pkg:/area:）。非空时执行
      # `nix run .#ci -- run-plan <labels>`，替代固定的 group。
      gate-labels:
        required: false
        type: string
        default: ""
      # 计划里的 gate / e2e 已由调用方按 shard 矩阵跑过时置 true：
      # 本 job 只构建剩余检查（`run-plan --without-suite`）。
      plan-exclude-suite:
        required: false
        type: boolean
        default: false
      # detect / policy job 的结果；失败时让必需检查保持失败，而不是跳过。
      precondition:
        required: false
        type: string
        default: "success"
      # 是否是「写缓存的那一个 job」。每个事件只留一个写入者（见 ci.yml / gates.yml）：
      # 同一个键被两个 job 同时 save 会互相覆盖。
      save:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # store 缓存里只放「跨 commit 稳定」的第三方工具闭包（`.#ci-deps`，实测
      # 1.3G nar / 149 路径），不放本 commit 的 vuna 产物：Nix 是内容寻址的，改一行
      # 源码就换一批 store path，上一代产物对新 commit 全是垃圾，却要为它们付整份
      # 解压（实测 1.4G 存档里 `tar -x` 占 62s，而能复用的只有 ~0.9G 依赖）。
      #
      # 键取「决定依赖闭包的那几个文件」而不是 `github.sha`：内容没变就必定命中
      # primary-key，于是下面的 save 自动跳过（`hit-primary-key == 'true'`），缓存不再
      # 被每次 main push 重写。只有 flake.lock / 工具集变了才重新写一代。
      - name: Restore Nix store
        id: restore
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-deps-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/build/common.nix', 'nix/build/ci-deps.nix') }}
          # 依赖换代时旧存档还能补齐没变的工具，比整份冷启动便宜。
          restore-prefixes-first-match: |
            nix-deps-${{ runner.os }}-

      - name: flake 求值
        if: inputs.eval
        run: env NIX_CONFIG='eval-cache = false' nix flake check --no-build

      - name: precondition
        if: inputs.precondition != 'success'
        run: |
          echo "precondition failed: ${{ inputs.precondition }}" >&2
          exit 1

      - name: plan
        if: inputs.gate-labels != ''
        env:
          GATE_LABELS: ${{ inputs.gate-labels }}
          PLAN_EXCLUDE_SUITE: ${{ inputs.plan-exclude-suite }}
        run: |
          extra=()
          if [ "$PLAN_EXCLUDE_SUITE" = "true" ]; then extra+=(--without-suite); fi
          read -r -a labels <<< "$GATE_LABELS"
          nix run .#ci -- plan "${extra[@]}" "${labels[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # 所有要跑 vuna 的组先把工具链并行建：默认 `--max-jobs 1` 会把 vuna-seed / 编译器 /
      # 各插件串行编两分钟（链：seed 15s → compiler 30s → toolchain 34s → dev 28s）。
      # 这些包彼此独立、单包单线程，4 并发摊开建。
      #
      # 建出来的产物**不登记 GC root**：它们由本 commit 的源码决定，下一个 commit 一定
      # 用不上。save 前只登记 `.#ci-deps`，让 gc 把它们连同 check 输出一起收走。
      - name: 预热工具链
        if: startsWith(inputs.group, 'gate-shard-') || startsWith(inputs.group, 'e2e-shard-') || inputs.group == 'pr' || inputs.group == 'units'
        run: |
          nix build --max-jobs 4 --cores 1 --no-link \
            .#vuna .#vuna-seed .#vuna-compiler .#vuna-cli .#vuna-toolchain \
            .#vuna-dev .#vuna-web-cli .#vuna-plugin-web \
            .#vuna-target-native .#vuna-target-wasm .#vuna-store

      # save 前的 `nix store gc --max` 只保「根闭包」：这里只登记跨 commit 稳定的依赖，
      # 本 commit 的工具链 / check 输出于是被当成垃圾收走。存档因此收敛到依赖闭包
      # （实测 store 3.5G → ~1.4G），restore 也随之从一分钟降到二十秒级。
      - name: 登记依赖根
        if: inputs.save
        run: |
          deps=$(nix build --no-link --print-out-paths .#ci-deps)
          sudo ln -sfn "$deps" /nix/var/nix/gcroots/vuna-ci-deps
          echo "=== gcroots vuna-ci-deps: $(nix-store --gc --print-roots 2>/dev/null | grep -c 'gcroots/vuna-ci-deps')"

      - name: ${{ inputs.group }}
        env:
          CI_JOBS: ${{ inputs.jobs }}
          GATE_LABELS: ${{ inputs.gate-labels }}
          PLAN_EXCLUDE_SUITE: ${{ inputs.plan-exclude-suite }}
        run: |
          if [ -n "${GATE_LABELS:-}" ]; then
            extra=()
            if [ "$PLAN_EXCLUDE_SUITE" = "true" ]; then extra+=(--without-suite); fi
            read -r -a labels <<< "$GATE_LABELS"
            nix run .#ci -- run-plan "${extra[@]}" "${labels[@]}"
          else
            nix run .#ci -- ${{ inputs.group }}
          fi

      # runner 实测的 suite 调度权重：`vuna-tests.sh` 末尾把它打进 derivation 日志，
      # 成功的构建不会回显日志，这里按需把那段摘出来（其余 check 没有这段，输出为空）。
      - name: 调度权重读数
        if: always()
        run: |
          for p in .ci/result*; do
            [ -e "$p" ] || continue
            nix log "$p" 2>/dev/null |
              sed -n -e '/=== suite-timing/p' -e '/=== suite-costs begin/,/=== suite-costs end/p' || true
          done

      # Nix 在 store 里留下 `<out>.lock`（root 0600），非 root 的 tar 打包会整体失败。
      - name: Drop builder lock files
        if: always()
        run: sudo rm -f /nix/store/*.lock

      # 独立 save action：check 失败也照常保存（if: always），所以不再需要
      # continue-on-error + ci-status 的间接层。
      #
      # `gc-max-store-size` 是**目标大小**：action 会算出（当前 store 大小 - 目标）交给
      # `nix store gc --max`（Nix 的 `--max` 语义是「最多释放多少」）。目标取依赖闭包
      # 大小 + 余量，per-commit 产物就被压掉了。
      - name: Save Nix store
        if: always() && inputs.save && steps.restore.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.restore.outputs.primary-key }}
          gc-max-store-size-linux: 1500M
          purge: true
          purge-prefixes: nix-deps-${{ runner.os }}-
          # 只留一代：purge 在 save 之后执行，save 失败时不会清掉旧缓存。
          purge-created: 0
          purge-primary-key: never