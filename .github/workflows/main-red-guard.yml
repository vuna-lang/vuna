name: main-red-guard

# 同一个 `main-red` issue 只允许一个修复 PR：第一个引用它的 PR 自动认领 issue，
# 后续 PR 加 `blocked`（automerge 会把已在队列里的 PR 移出）。换人时先在 issue 上 unassign。
on:
  pull_request_target:
    types: [opened, edited, reopened]

concurrency:
  group: main-red-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  guard:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: claim or block
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # 只处理 closing keywords（Closes / Fixes / Resolves）；Refs 不触发认领。
          issues=$(printf '%s\n' "${BODY:-}" |
            grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' |
            grep -Eo '[0-9]+' | sort -u || true)
          [ -n "$issues" ] || exit 0

          for n in $issues; do
            if ! meta=$(gh api "repos/$REPO/issues/$n" --jq '{
              state,
              labels: [.labels[].name],
              assignees: [.assignees[].login],
              status: (.status.name // "")
            }' 2>/dev/null); then
              continue
            fi
            [ "$(jq -r '.state' <<<"$meta")" = "open" ] || continue
            is_main_red=$(jq -r '[.labels] | index("main-red") != null' <<<"$meta")
            [ "$is_main_red" = "true" ] || continue

            assignees=$(jq -r '.assignees[]' <<<"$meta")
            in_progress=$(jq -r '.status == "In progress"' <<<"$meta")
            if [ -z "$assignees" ] && [ "$in_progress" != "true" ]; then
              gh issue edit "$n" --repo "$REPO" --add-assignee "$AUTHOR"
              gh api -X PATCH "repos/$REPO/issues/$n" -f status="In progress" >/dev/null
              gh issue comment "$n" --repo "$REPO" \
                --body "PR #$PR 认领（@$AUTHOR）。"
              echo "main-red-guard: PR #$PR 认领 issue #$n"
              continue
            fi

            if printf '%s\n' "$assignees" | grep -Fqx "$AUTHOR"; then
              continue
            fi

            owner=$(printf '%s\n' "$assignees" | paste -sd ',' -)
            if [ -n "$owner" ]; then
              claimed_by="已由 @$owner 认领"
            else
              claimed_by="已标记 In progress（未 assign）；先确认认领人"
            fi
            already=$(gh pr view "$PR" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -Fc '<!-- main-red-guard -->' || true)
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR" --repo "$REPO" --body "<!-- main-red-guard -->
              main 红灯 issue #$n $claimed_by；本 PR 先加 blocked，避免重复修复。需要接手时先在 issue 上 unassign。"
            fi
            gh pr edit "$PR" --repo "$REPO" --add-label blocked || true
            gh issue comment "$n" --repo "$REPO" \
              --body "PR #$PR 也引用了本 issue；已 block，避免重复修复。"
            echo "main-red-guard: PR #$PR 被 block（issue #$n）"
          done