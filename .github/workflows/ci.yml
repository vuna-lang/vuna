name: ci

# push / PR 只跑最小档 `pr`（fmt + lint + 自检）。完整便宜门禁 `deep` 与长尾
# `suite` / `backends` / `native` / `browser` 走定时、手动 dispatch 或带对应标签的
# PR；每组一个独立 job + 独立 Nix store 缓存，互不拖累。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR 上只保留最新一次 push；main 上不互相取消——否则后一次 push 会把前一次还没
  # 跑完的门禁直接砍掉，长任务永远等不到结论。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# cache action 的 purge 需要 actions: write；_check.yml 的权限上限由这里决定。
permissions:
  contents: read
  actions: write

jobs:
  pr:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/_check.yml
    with:
      group: pr
      timeout: 30
      jobs: 2
      eval: true
      cache-size: 1.5G
      save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deep')
    uses: ./.github/workflows/_check.yml
    with:
      group: deep
      timeout: 60
      jobs: 2
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'suite')
    uses: ./.github/workflows/_check.yml
    with:
      group: suite
      timeout: 60
      jobs: 1

  backends:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'backend')
    uses: ./.github/workflows/_check.yml
    with:
      group: backends
      timeout: 60
      jobs: 1

  native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'backend')
    uses: ./.github/workflows/_check.yml
    with:
      group: native
      timeout: 120
      jobs: 1

  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: browser
      timeout: 60
      jobs: 1