name: ci

# PR 的固定必需检查是 `pr`（fmt + lint + 自检）；增量检查由 gates.yml 按 type + area
# 选择（area → `vuna-tests-*` 切片，见 nix/checks/slices.nix）。main push 额外跑完整
# `gate`（fast+integration）；`deep` / `suite` / `browser` 在定时与手动 dispatch 上跑整组，
# PR 需要强制整组时加对应标签由 gates 计划器带上。
#
# 注意：GitHub 不为 `GITHUB_TOKEN` 执行的推送创建工作流运行。auto-merge 的合并归
# `github-actions[bot]`，因此不会触发 main push 的 `gate`（人工 / break-glass 推送会）。
# 需要覆盖自动合并时，给仓库配置 `AUTOMERGE_TOKEN`（automerge.yml 已优先使用它；
# 创建步骤见 docs/reference/github-workflow.md「自动合并」）；
# 在此之前 main 的完整基线由定时 `suite` 组（gate + e2e）承担。
#
# `backends`（wasm / native 矩阵）与 `native`（自举 conformance）暂不在 GitHub CI 跑：
# 本地用 `nix run .#ci -- backends` / `nix run .#ci -- native`。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR 上只保留最新一次 push；main 上不互相取消——否则后一次 push 会把前一次还没
  # 跑完的门禁直接砍掉，长任务永远等不到结论。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# cache action 的 purge 需要 actions: write；_check.yml 的权限上限由这里决定。
permissions:
  contents: read
  actions: write

jobs:
  pr:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/_check.yml
    with:
      group: pr
      timeout: 30
      jobs: 2
      eval: true
      cache-size: 1.5G
      save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # main push 的完整 suite 层（fast+integration）：PR 只跑命中的 area 切片
  # （gates.yml），合并后在这里把完整夹具基线跑一遍；e2e / backends 仍只在定时与手动 dispatch。
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_check.yml
    with:
      group: gate
      timeout: 60
      jobs: 1
      cache-size: 2G
      save: true

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: deep
      timeout: 60
      jobs: 2
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: suite
      timeout: 60
      jobs: 1

  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: browser
      timeout: 60
      jobs: 1