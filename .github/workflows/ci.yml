name: ci

# PR 的固定必需检查是 `pr`（fmt + lint + 自检）；增量检查由 gates.yml 按 type + area
# 选择（area → `vuna-tests-*` 切片；计划里的完整 gate / e2e 换成 gate-shard-* /
# e2e-shard-* 由 `suite` matrix 并行，见 nix/checks/slices.nix）。`merge_group` 上本文件
# 只跑 `pr`；完整 suite 由 gates.yml 在合并组 head 上跑，作为合并队列的 required check。
# main push 仍跑完整 `gate`（fast+integration）作为合并后兜底；定时 / 手动再跑 `e2e`
# 与 `deep` / `browser`。完整 suite 在 CI 里按 case 耗时拆成 4 个 shard matrix job 并行；
# 包内单测是独立 job。
#
# 注意：合并由 GitHub 队列执行，不再由 automerge 直接 merge；main push 的 `gate` 保留为
# 合并后兜底。`AUTOMERGE_TOKEN` 仍用于 automerge 的入队身份（创建步骤见
# docs/reference/github-workflow.md「合并队列」）。
#
# `backends`（wasm / native 矩阵）与 `native`（自举 conformance）只在定时 / 手动跑：
# `native` 的大头是单线程的 native 自举编译（约 20+ 分钟），`backends` 是两遍完整
# fast+integration suite；都不适合每次 push。本地仍可单独跑
# `nix run .#ci -- backends` / `nix run .#ci -- native`。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  # merge_group 的 ref 是队列临时分支；与 main push / PR 分开分组，避免临时分支的 push
  # 事件（如果将来放宽 push 过滤器）取消正在跑的 merge_group 检查。
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # PR 上只保留最新一次 push；main / merge_group 上不互相取消——否则后一次 push 会把
  # 前一次还没跑完的门禁直接砍掉，长任务永远等不到结论。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# cache action 的 purge 需要 actions: write；_check.yml 的权限上限由这里决定。
permissions:
  contents: read
  actions: write

jobs:
  pr:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/_check.yml
    with:
      group: pr
      timeout: 30
      jobs: 2
      eval: true
      # 必须是「整数 + 单位」：`1.5G` 不被 action 解析，会被当成没设上限（日志
      # `Not collecting garbage because none of "gc-max-store-size" ... are specified`），
      # pr 的 store 因此一路涨到 8.5G、restore 91s。
      # 上限要盖住整个 store 而不是「真实闭包」：gc 只保根闭包，工具链是构建输入，
      # 上限一触发就把它删掉（实测登记 GC root 也没兜住，见 _check.yml 的预热步）；
      # pr 的 store 实测 3.5G，取 6G 与分片同口径，正常情况不触发 gc。
      cache-size: 6G
      save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # main push 的完整 suite 层（fast+integration）：PR 只跑命中的 area 切片
  # （gates.yml），合并后在这里把完整夹具基线跑一遍。按 case 耗时均分成 4 片并行，
  # 每片仍是完整集合的一部分（不是采样）；包内单测单独一个 job。
  gate-shards:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/_check.yml
    with:
      group: gate-shard-${{ matrix.shard }}
      cache-key: suite
      timeout: 60
      jobs: 1
      # store 实测 ~3.7G；2G 的 gc 上限会在 save 前把工具链（`vuna` / seed / 插件）
      # 当“构建输入=垃圾”删掉，下一个 job 只能从头重编（~2min/片）。
      cache-size: 6G
      save: ${{ matrix.shard == 0 }}

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: deep
      timeout: 60
      jobs: 2
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  # 后端矩阵（wasm / native suite）：两遍完整 fast+integration + 全包单测。
  # 一个派生吃掉 runner 的全部核（jobs: 1 → cores = 核数），4 核上约 10 分钟。
  backends:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: backends
      timeout: 90
      jobs: 1
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  # native 自举 conformance（构建即运行 `backend-check --scope all`）。大头是单线程的
  # native 自举编译（20+ 分钟），conformance 本身约 5 分钟；只放定时 / 手动。
  native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: native
      timeout: 120
      jobs: 1
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  # e2e（steps / 长 case）按耗时均分成 8 片并行：case 总耗时是 gate 的两倍多，而单片
  # 4 lane 的实测并行只有 ~2x（I/O 与进程启动），横向多开 shard 比片内加并发有效。
  e2e-shards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    uses: ./.github/workflows/_check.yml
    with:
      group: e2e-shard-${{ matrix.shard }}
      cache-key: suite
      timeout: 60
      jobs: 1
      # e2e 的 store 比 gate 更大（web-cli / wasm 工具）；同样给足上限，
      # 第 0 片把这份 cache 写到 `nix-suite-` 前缀（夜间 / 手动）。
      cache-size: 6G
      save: ${{ matrix.shard == 0 }}

  # 包内单测（vuna test packages/*）与 suite 解耦，独立并行。
  units:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: units
      cache-key: suite
      timeout: 45
      jobs: 1
      cache-size: 2G

  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: browser
      timeout: 60
      jobs: 1