name: ci

# PR 的常跑门禁只有 `pr`（fmt + lint + 自检）；`deep` / `suite` 由 PR 标签在
# label-checks.yml 里按需触发，nightly 与手动 dispatch 兜底。这样标签事件不会重跑或
# 取消 required 的 `pr / run`。
#
# `backends`（wasm / native 矩阵）与 `native`（自举 conformance）暂不在 GitHub CI 跑：
# 本地用 `nix run .#ci -- backends` / `nix run .#ci -- native`。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR 上只保留最新一次 push；main 上不互相取消——否则后一次 push 会把前一次还没
  # 跑完的门禁直接砍掉，长任务永远等不到结论。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# cache action 的 purge 需要 actions: write；_check.yml 的权限上限由这里决定。
permissions:
  contents: read
  actions: write

jobs:
  pr:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/_check.yml
    with:
      group: pr
      timeout: 30
      jobs: 2
      eval: true
      cache-size: 1.5G
      save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: deep
      timeout: 60
      jobs: 2
      cache-size: 2G
      save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: suite
      timeout: 60
      jobs: 1

  browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_check.yml
    with:
      group: browser
      timeout: 60
      jobs: 1