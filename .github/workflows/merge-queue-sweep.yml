name: merge-queue-sweep

# GitHub 回归（community#209348，2026-09 起）：规则集合并队列下，已 arm 的 PR 在
# required checks 变绿后不再自动入队，会一直停在 CLEAN。这里在 checks 完成时立即补一次，
# cron 只做漏网事件的兜底；只处理非 draft、无 hold、已 arm、mergeStateStatus=CLEAN/UNSTABLE
# 且不在队列里的 PR。
#
# 手动执行：nix/tools/merge-queue.sh sweep [--dry-run] [<pr>...]
on:
  # ci / gates 在 PR 上完成时立即补入队；merge_group 的运行由下面的 conditions 过滤掉。
  workflow_run:
    workflows: [ci, gates]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-queue-sweep
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sweep:
    # workflow_run 只处理 PR 触发的运行；main push / merge_group 的运行直接跳过。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sweep the pull request that triggered the run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          prs="${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}"
          if [ -z "$prs" ]; then
            echo "merge-queue-sweep: 触发运行没有关联 PR，跳过"
            exit 0
          fi
          # shellcheck disable=SC2086
          nix/tools/merge-queue.sh sweep $prs
      - name: sweep all open pull requests
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: nix/tools/merge-queue.sh sweep
