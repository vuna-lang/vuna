name: issue-triage

# issue 打开时同步原生元数据：标题前缀 -> issue type，epic 进入 Todo，
# 缺少类型时补 needs-refinement。
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          nix/tools/issue-triage.sh "$REPO" "$ISSUE" "$ACTION"