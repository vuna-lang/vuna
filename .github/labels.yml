# 仓库标签的唯一事实来源。
#
# 同步：`nix/tools/github-labels.sh --sync`（幂等）。
# 迁移旧标签：`nix/tools/github-labels.sh --migrate`（先加新标签，再删旧标签）。
# 原生 issue status / type / priority 不在这里：status 与 priority 走 REST，
# type 是 org 级 issue type；type:* 标签只用于 PR 门禁路由。
#
# 每个条目只使用 name / color / description 三个字段；脚本按这个固定形状解析。

- name: "type:bug"
  color: "d73a4a"
  description: "缺陷或回归"
- name: "type:feature"
  color: "a2eeef"
  description: "新功能或行为扩展"
- name: "type:refactor"
  color: "ab5717"
  description: "不改变行为的重构"
- name: "type:perf"
  color: "0ef9e2"
  description: "性能优化或复杂度回归"
- name: "type:docs"
  color: "0075ca"
  description: "文档、注释或说明"
- name: "type:test"
  color: "bfd4f2"
  description: "测试、夹具或门禁用例"
- name: "type:chore"
  color: "ededed"
  description: "构建、CI、依赖或维护工作"
- name: "type:epic"
  color: "5319e7"
  description: "方向或多任务集合"


