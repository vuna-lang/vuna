name: Feature
description: 提议一个新功能或行为扩展
title: "[feat] "
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 当前哪里不够用，为什么需要这个功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 期望的行为、接口或语法；可以只写方向。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 非目标
      description: 试过或明确不做的方案。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算完成；尽量写成可验证的条件。
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 影响面
      description: 涉及的 pkg / area；不确定可以留空。
    validations:
      required: false