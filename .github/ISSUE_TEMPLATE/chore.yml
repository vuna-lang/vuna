name: Chore
description: 构建、CI、依赖、bench 或仓库维护
title: "[chore] "
body:
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 来源 PR / issue / commit，以及为什么现在要做。
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 要做的事
      description: 具体改动点，尽量落到文件或模块。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 跑哪些检查、看什么结果。
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 影响面
      description: 涉及的 pkg / area。
    validations:
      required: false